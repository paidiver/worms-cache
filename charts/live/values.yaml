replicaCount: 1

ingress:
  host: worms-cache.paidiver.site
  path: ""
  tls:
    - secretName: letsencrypt-worms-cache
      hosts:
        - worms-cache.paidiver.site

api:
  workers: 1
  env:
    djangoCorsAllowedOrigins: "https://paidiver.github.io"
    djangoCorsAllowAll: "0"

postgresql:
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      limits:
        memory: 1Gi
