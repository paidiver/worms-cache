{{- if .Values.refreshCron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "worms-cache-api.fullname" . }}-refresh
  labels:
    {{- include "worms-cache-api.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.refreshCron.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}


          containers:
            - name: refresh
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              securityContext:
                runAsUser: {{ .Values.api.securityContext.runAsUser | default 1000 }}
                runAsNonRoot: true
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                - name: DJANGO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.api.env.djangoSecretKey.secretName }}
                      key: {{ .Values.api.env.djangoSecretKey.secretKey }}
                - name: DJANGO_DEBUG
                  value: {{ .Values.api.env.djangoDebug | quote }}
                - name: POSTGRES_HOST
                  value: {{ .Values.db.host | quote }}
                - name: POSTGRES_PORT
                  value: {{ .Values.db.port | default "5432" | quote }}
                - name: POSTGRES_DB
                  value: "{{ .Values.auth.database }}"
                - name: POSTGRES_USER
                  value: "{{ .Values.auth.username }}"
                - name: POSTGRES_PASSWORD
                  value: "{{ .Values.auth.password }}"

                - name: DB_HOST
                  value: {{ .Values.db.host | quote }}
                - name: DB_PORT
                  value: {{ .Values.db.port | default "5432" | quote }}
                - name: DB_NAME
                  value: "{{ .Values.auth.database }}"
                - name: DB_USER
                  value: "{{ .Values.auth.username }}"
                - name: DB_PASSWORD
                  value: "{{ .Values.auth.password }}"
              command:
                {{- toYaml .Values.refreshCron.args | nindent 16 }}

          {{- $pullSecret := .Values.api.image.imagePullSecret | default "" -}}
          {{- if $pullSecret }}
          imagePullSecrets:
            - name: {{ $pullSecret }}
          {{- end }}
{{- end }}
