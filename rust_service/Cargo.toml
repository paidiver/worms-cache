[package]
name = "worms-cache-rust"
version = "0.1.0"
edition = "2021"
description = "WoRMS cache read-only REST API implemented in Rust using Axum"

[[bin]]
name = "worms-cache-rust"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }

# Database (no compile-time checked macros — avoids needing DATABASE_URL at build time)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Handles repeated query-string keys like `aphia_ids[]=1&aphia_ids[]=2`
serde_qs = "0.13"

# HTTP middleware
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Environment / config
dotenvy = "0.15"

# Error handling
thiserror = "1"
anyhow = "1"

# Outbound HTTP (taxamatch service)
reqwest = { version = "0.12", features = ["json"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Scientific-name normalisation
unicode-normalization = "0.1"
regex = "1"

# Required for custom Axum extractors
async-trait = "0.1"

# OpenAPI / Swagger-UI
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
