source = { virtual = "." }
dependencies = [
    { name = "django" },
    { name = "django-cors-headers" },
    { name = "djangorestframework" },
    { name = "drf-spectacular" },
    { name = "drf-spectacular-sidecar" },
    { name = "drf-yasg" },
    { name = "gunicorn" },
    { name = "psycopg", extra = ["binary"] },
    { name = "requests" },
    { name = "whitenoise" },
]

[package.dev-dependencies]
dev = [
    { name = "sqlalchemy" },
]
lint = [
    { name = "ruff" },
]
test = [
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "tox" },
]
types = [
    { name = "pyright" },
]

[package.metadata]
requires-dist = [
    { name = "django", specifier = "==4.2.3" },
    { name = "django-cors-headers", specifier = ">=4.9.0,<5.0.0" },
    { name = "djangorestframework", specifier = "==3.15.2" },
    { name = "drf-spectacular", specifier = ">=0.27.0,<0.28.0" },
    { name = "drf-spectacular-sidecar", specifier = ">=2024.7.1,<2025.0.0" },
    { name = "drf-yasg", specifier = ">=1.21.10,<2.0.0" },
    { name = "gunicorn", specifier = ">=25.0.3,<26.0.0" },
    { name = "psycopg", extras = ["binary"], specifier = ">=3.1,<4.0.0" },
    { name = "requests", specifier = ">=2.31.0,<3.0.0" },
    { name = "whitenoise", specifier = ">=6.7.0,<7.0.0" },
]

[package.metadata.requires-dev]
dev = [{ name = "sqlalchemy", specifier = ">=2.0.46,<3.0.0" }]
lint = [{ name = "ruff", specifier = ">=0.5,<0.6.0" }]
test = [
    { name = "pytest", specifier = ">=7.3.0,<8.0.0" },
    { name = "pytest-cov", specifier = ">=4.0.0,<5.0.0" },
    { name = "tox", specifier = ">=4.0.0,<5.0.0" },
]
types = [{ name = "pyright", specifier = ">=1.1,<2" }]
