[project]
name = "worms-cache"
version = "0.0.0"
description = "WoRMS Cache is a caching layer for the WoRMS API, designed to improve performance and reduce load on the WoRMS servers by storing frequently accessed data locally."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django==4.2.3",
  "djangorestframework==3.15.2",
  "psycopg[binary]>=3.1,<4.0.0",
  "drf-spectacular>=0.27.0,<0.28.0",
  "drf-spectacular-sidecar>=2024.7.1,<2025.0.0",
  "drf-yasg>=1.21.10,<2.0.0",
  "requests>=2.31.0,<3.0.0",
  "gunicorn>=25.0.3,<26.0.0",
  "django-cors-headers>=4.9.0,<5.0.0",
  "whitenoise>=6.7.0,<7.0.0",
]

[dependency-groups]
lint = [
  "ruff>=0.5,<0.6.0",
]
dev = [
  "sqlalchemy>=2.0.46,<3.0.0",
]
test = [
  "pytest>=7.3.0,<8.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "tox>=4.0.0,<5.0.0",
]
types = ["pyright>=1.1,<2"]

# Django application deployed as a container, not an installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  ".venv",
  "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config"]
