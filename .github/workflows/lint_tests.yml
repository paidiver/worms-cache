name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (tox -e lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
          enable-cache: true
          python-version: "3.13"

      - name: Run lint
        run: |
          uv run --locked --no-default-groups --group test tox -e lint

  test:
    name: Tests (tox)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: worms-cache-db
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
        options: >-
          --health-cmd="pg_isready -U myuser -d worms-cache-db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_DB: worms-cache-db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"

      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
          enable-cache: true
          python-version: "3.13"

      - name: Install system deps (GDAL / GEOS) if needed
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Run migrations (CI)
        run: |
          uv run --locked --no-default-groups python manage.py migrate --noinput

      - name: Run tests
        run: |
          uv run --locked --no-default-groups --group test tox -e py313
