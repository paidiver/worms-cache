name: SchemaSpy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  generate:
    uses: paidiver/brokerage-service/.github/workflows/reusable-schemaspy.yml@main
    with:
      database_service: worms-db
      application_service: worms-cache
      database_name: worms-cachedb
      database_host: worms-db
      extra_env: |
        POSTGRES_PORT_ALEMBIC=5432
        POSTGRES_HOST_ALEMBIC=worms-db
      excluded_tables: ^(auth_group|auth_group_permissions|auth_permission|auth_user|auth_user_groups|auth_user_user_permissions|django_admin_log|django_content_type|django_migrations|django_session)$
