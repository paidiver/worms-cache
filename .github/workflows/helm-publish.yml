name: Release Helm Charts

on:
  push:
    tags: ['v*']

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: paidiver/brokerage-service/.github/workflows/reusable-helm-publish.yml@main
    with:
      chart_file: charts/api/Chart.yaml
      charts_dir: charts
