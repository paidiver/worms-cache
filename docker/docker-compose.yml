services:
  worms-db:
    image: postgres:18
    container_name: worms_cache_db
    restart: always
    env_file:
      - ../.env
    volumes:
      - worms_pg_data:/var/lib/postgresql
    ports:
      - "5436:5432"
    networks:
      - shared_services
  worms-cache:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    restart: always
    depends_on:
      - worms-db
    ports:
      - "8001:8000"
    command: >
      sh -c "bash /tmp/scripts/wait-for-it.sh worms-db:5432 --timeout=30 &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../:/app:Z
      - ../docker/scripts:/tmp/scripts
    networks:
      - shared_services
  taxamatch:
    build:
      context: ../
      dockerfile: docker/Dockerfile.taxamatch
    environment:
      PORT: "8080"
      RACK_ENV: "development"
      PUMA_WORKERS: "1"
      PUMA_THREADS: "8"
      MAX_NAMES: "50"
      MAX_CANDIDATES_PER_NAME: "300"
    ports:
      - "8082:8080"
    volumes:
      - ../taxamatch_service:/app:Z
    restart: unless-stopped
    networks:
      - shared_services
volumes:
  worms_pg_data:

networks:
  shared_services:
    external: true
